<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="LogEcogarzones.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecogarzones · Inicio Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="Ecogarzones/image/logo.png" />
</head>

<body>
    <div class="container">
        <div class="login-container">
            <!-- Logo agregado -->
            <div class="logo-container">
                <img src="Ecogarzones/image/logo.png" alt="Ecogarzones" />
            </div>
            
            <h1>Iniciar Sesión</h1>
            
            <form action="#" method="POST">
                <input type="text" name="username" placeholder="Usuario" required />
                <input type="password" name="password" placeholder="Contraseña" required />
                <button type="submit">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>
            
            <p>
                ¿No tienes una cuenta? 
                <a href="RegEcogarzones.html">Regístrate aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
