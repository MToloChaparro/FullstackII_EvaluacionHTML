<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Solicitud</title>
    <link rel="stylesheet" href="css/estilo_pedirservicio_detalleevento.css">
</head>

<body>

<div class="form-card">
    <h2>Formulario de Solicitud</h2>
    <p>Ingrese los datos del cliente que solicitará el Evento:</p>

    <form action="detallesevento.html" method="GET">
        
        <div class="form-group">
            <label for="fname">Nombre del Cliente:</label>
            <input type="text" id="fname" name="fname">
        </div>

        <div class="form-group">
            <label for="lname">Apellidos del Cliente:</label>
            <input type="text" id="lname" name="lname">
        </div>

        <div class="form-group">
            <label for="rut">Rut:</label>
            <input type="text" id="rut" name="rut">
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono de Contacto:</label>
            <input type="text" id="telefono" name="telefono">
        </div>

        <div class="form-group">
            <label for="correo">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo">
        </div>

        <a href="detallesevento.html">
            <button type="button">Detalles del Evento</button>
        </a>

    </form>
</div>

</body>
</html>
